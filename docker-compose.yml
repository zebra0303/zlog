services:
  zlog:
    build: .
    container_name: zlog
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./docker-data/db:/app/data
      - ./docker-data/uploads:/app/uploads
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/zlog.db
      - PORT=3000
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: zlog-caddy
    restart: unless-stopped
    profiles: [production]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      zlog:
        condition: service_healthy

  backup:
    image: alpine:3
    container_name: zlog-backup
    profiles: [backup]
    volumes:
      - ./docker-data/db:/data:ro
      - ./docker-data/backups:/backups
    entrypoint: /bin/sh
    # Use sqlite3 online backup API instead of raw cp to avoid corrupting active WAL databases
    command: >
      -c 'apk add --no-cache sqlite >/dev/null 2>&1 && while true; do
        BACKUP_FILE="/backups/zlog-$(date +%Y%m%d_%H%M%S).db";
        sqlite3 /data/zlog.db ".backup '\''$$BACKUP_FILE'\''";
        echo "Backup created: $$BACKUP_FILE";
        find /backups -name "*.db" -mtime +7 -delete;
        sleep 86400;
      done'
    restart: unless-stopped
    depends_on:
      - zlog

volumes:
  caddy-data:
  caddy-config:
